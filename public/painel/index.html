<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel da estética</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1f3a9e">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/painel.css">
  <script type="module" src="../assets/js/painel/app.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="painel">
    <nav class="trilho" aria-label="Painel">
      <a class="trilho__marca" href="#/" id="marca">Painel</a>
      <ul class="trilho__abas" role="list" id="abas"></ul>
      <a class="trilho__link" href="../" target="_blank" rel="noopener" id="ver-link">Ver o link público</a>
    </nav>
    <main class="area" id="conteudo" tabindex="-1">
      <p class="carregando">Carregando o painel…</p>
    </main>
  </div>
  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>
</body>
</html>
